[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icare-rules"
version = "0.1.0"
description = "Pipeline de classification des règles ICARE (Déterministe / Qualitative / Hybride) avec Azure OpenAI."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ivado Consulting" },
]
license = { text = "Proprietary" }
dependencies = [
    "python-docx>=1.1.2",
    "openai>=1.51.0",
    "pydantic>=2.8.0",
    "PyYAML>=6.0.2",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "tqdm>=4.66.5",
    "qdrant-client>=1.12.0",
    "streamlit>=1.38.0",
    "pypdf>=5.0.0",
    "reportlab>=4.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
]

[project.scripts]
icare-rules = "icare_rules.cli:app"
icare-poc = "icare_poc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/icare_rules", "src/icare_poc"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 is idiomatic for Typer default options; SIM115 conflicts with tempfile
# patterns that intentionally keep the handle beyond the function.
ignore = ["E501", "B008", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
